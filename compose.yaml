services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prosper
      POSTGRES_USER: prosper
      POSTGRES_PASSWORD: prosper_local_only
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prosper -d prosper"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - prosper_postgres:/var/lib/postgresql/data

volumes:
  prosper_postgres:
